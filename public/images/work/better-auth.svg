<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img">
<style>
:root { --paper:#f7f7f4; --ink:#18212b; --muted:#98a0a8; --line:#d8dde0; --panel:#ffffff; --panel2:#eef1f2; --accent:#8a5cf5; --accent2:#20252b; }
@media (prefers-color-scheme: dark) { :root { --paper:#1b1d1f; --ink:#f4f5f2; --muted:#737b83; --line:#394046; --panel:#24282b; --panel2:#30363a; } }
text { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.08em; }
.line { fill:none; stroke:var(--line); stroke-width:2; }
.ink { fill:var(--ink); }
.muted { fill:var(--muted); }

.motion-float { animation: work-float 5.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.motion-float-delayed { animation: work-float 6.5s ease-in-out .55s infinite; transform-box: fill-box; transform-origin: center; }
.motion-dash { animation: work-dash 4s linear infinite; }
.motion-pulse { animation: work-pulse 3.5s ease-in-out infinite; }
.motion-orbit { animation: work-orbit 24s linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes work-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes work-dash { to { stroke-dashoffset: -42; } }
@keyframes work-pulse { 0%, 100% { opacity: .72; } 50% { opacity: 1; } }
@keyframes work-orbit { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .motion-float, .motion-float-delayed, .motion-dash, .motion-pulse, .motion-orbit { animation: none !important; } }
</style>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--paper)"/><stop offset="1" stop-color="var(--panel2)"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--panel)"/><stop offset="1" stop-color="var(--panel2)"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#101820" flood-opacity=".14"/></filter>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" class="line" opacity=".34"/></pattern>
</defs>
<rect width="1200" height="750" fill="url(#paper)"/>
<rect x="36" y="36" width="1128" height="678" rx="24" fill="url(#grid)" opacity=".42"/>

<g class="motion-pulse" filter="url(#shadow)" transform="translate(432 132)">
  <path d="M168 0c66 0 120 54 120 120v44h-55v-44c0-36-29-65-65-65s-65 29-65 65v44H48v-44C48 54 102 0 168 0Z" fill="var(--panel2)" stroke="var(--line)" stroke-width="4"/>
  <rect x="0" y="130" width="336" height="264" rx="28" fill="var(--panel)" stroke="var(--line)" stroke-width="4"/>
  <rect x="22" y="152" width="292" height="220" rx="18" fill="var(--accent)" opacity=".9"/>
  <circle cx="168" cy="246" r="42" fill="var(--paper)"/><rect x="153" y="239" width="30" height="70" rx="15" fill="var(--ink)"/><circle cx="168" cy="229" r="22" fill="var(--ink)"/>
  <path d="M72 342h192" stroke="var(--paper)" stroke-width="5" stroke-dasharray="2 16" stroke-linecap="round" opacity=".7"/>
  <text x="84" y="178" font-size="16" fill="var(--paper)">SESSION GATE</text>
</g>
<g class="motion-float-delayed" filter="url(#shadow)">
  <path d="M180 244h172l42 25v120l-42 25H180l-42-25V269Z" fill="var(--panel)" stroke="var(--line)" stroke-width="3"/>
  <path d="m180 244 42 25h172l-42-25Z" fill="var(--accent2)" opacity=".85"/>
  <path d="M210 307h130M210 333h92" stroke="var(--line)" stroke-width="7" stroke-linecap="round"/><circle cx="189" cy="307" r="8" fill="var(--accent2)"/>
</g>
<g class="motion-float-delayed" filter="url(#shadow)">
  <path d="M838 252h178l42 25v120l-42 25H838l-42-25V277Z" fill="var(--panel)" stroke="var(--line)" stroke-width="3"/>
  <path d="m838 252 42 25h178l-42-25Z" fill="var(--accent2)" opacity=".85"/>
  <path d="M868 310h132M868 338h84" stroke="var(--line)" stroke-width="7" stroke-linecap="round"/><circle cx="847" cy="310" r="8" fill="var(--accent2)"/>
</g>
<g transform="translate(482 540)"><path d="m0 42 106-42 106 42-106 42Z" fill="var(--panel)" stroke="var(--line)" stroke-width="3"/><path d="M0 42v55l106 38V82Z" fill="var(--panel2)" stroke="var(--line)" stroke-width="3"/><path d="m212 42-106 40v53l106-38Z" fill="var(--accent)" opacity=".88"/><circle cx="106" cy="42" r="19" fill="var(--accent2)"/></g>
<path class="motion-dash" d="M396 324h400" stroke="var(--accent2)" stroke-width="5" stroke-dasharray="2 18" stroke-linecap="round"/>

</svg>