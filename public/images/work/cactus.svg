  <rect x="42" y="83" width="654" height="277" rx="16" fill="var(--panel2)"/>
  <path d="M86 295h564" stroke="var(--line)" stroke-width="3"/><path d="M86 295v-18M180 295v-10M274 295v-18M368 295v-10M462 295v-18M556 295v-10M650 295v-18" stroke="var(--line)" stroke-width="3"/>
  <path d="M108 229h154" stroke="var(--accent)" stroke-width="22" stroke-linecap="round"/><path d="M294 229h190" stroke="var(--accent2)" stroke-width="22" stroke-linecap="round"/><path d="M516 229h98" stroke="var(--muted)" stroke-width="22" stroke-linecap="round"/>
  <text x="86" y="126" font-size="18" class="muted">FOCUS SCHEDULE</text><text x="86" y="167" font-size="28" class="ink">08:30  —  12:00</text>
</g>
