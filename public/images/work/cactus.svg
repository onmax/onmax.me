  <path d="M68 188c-17-27-17-53 0-78V55c0-33 49-33 49 0v23c13-17 45-12 45 13v39c20-20 52-2 43 23l-19 55c-11 31-39 49-73 49-32 0-54-7-75-29Z" fill="var(--accent)" stroke="var(--line)" stroke-width="4"/>
  <path d="M67 189c-24-25-28-62-14-88l15-27c12-22 44-7 35 16l-8 21c12-13 34-6 34 12v51" fill="none" stroke="var(--accent)" stroke-width="22" stroke-linecap="round"/>
  <path d="M55 255h142l-18 33H73Z" fill="var(--accent2)" stroke="var(--line)" stroke-width="3"/>
</g>
