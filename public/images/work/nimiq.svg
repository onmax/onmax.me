<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img">
<style>
:root { --paper:#f7f7f4; --ink:#18212b; --muted:#98a0a8; --line:#d8dde0; --panel:#ffffff; --panel2:#eef1f2; --accent:#13c6b5; --accent2:#ffc83d; }
@media (prefers-color-scheme: dark) { :root { --paper:#1b1d1f; --ink:#f4f5f2; --muted:#737b83; --line:#394046; --panel:#24282b; --panel2:#30363a; } }
text { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.08em; }
.line { fill:none; stroke:var(--line); stroke-width:2; }
.ink { fill:var(--ink); }
.muted { fill:var(--muted); }

.motion-float { animation: work-float 5.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.motion-float-delayed { animation: work-float 6.5s ease-in-out .55s infinite; transform-box: fill-box; transform-origin: center; }
.motion-dash { animation: work-dash 4s linear infinite; }
.motion-pulse { animation: work-pulse 3.5s ease-in-out infinite; }
.motion-orbit { animation: work-orbit 24s linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes work-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes work-dash { to { stroke-dashoffset: -42; } }
@keyframes work-pulse { 0%, 100% { opacity: .72; } 50% { opacity: 1; } }
@keyframes work-orbit { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .motion-float, .motion-float-delayed, .motion-dash, .motion-pulse, .motion-orbit { animation: none !important; } }
</style>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--paper)"/><stop offset="1" stop-color="var(--panel2)"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--panel)"/><stop offset="1" stop-color="var(--panel2)"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#101820" flood-opacity=".14"/></filter>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" class="line" opacity=".34"/></pattern>
</defs>
<rect width="1200" height="750" fill="url(#paper)"/>
<rect x="36" y="36" width="1128" height="678" rx="24" fill="url(#grid)" opacity=".42"/>

<g class="motion-pulse" filter="url(#shadow)" transform="translate(270 108)">
  <path d="M350 0c194 0 350 116 350 260S544 520 350 520 0 404 0 260 156 0 350 0Z" fill="var(--panel)" stroke="var(--line)" stroke-width="4"/>
  <path d="M0 260h700M350 0c-72 78-112 165-112 260s40 182 112 260M350 0c72 78 112 165 112 260s-40 182-112 260" fill="none" stroke="var(--line)" stroke-width="3"/>
  <path d="M75 157c72-43 146-65 224-65 130 0 246 46 332 132" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round"/>
  <path d="M74 367c93 58 180 83 276 83 112 0 208-28 277-73" fill="none" stroke="var(--accent2)" stroke-width="9" stroke-linecap="round"/>
  <circle cx="300" cy="106" r="16" fill="var(--accent)"/><circle cx="566" cy="221" r="16" fill="var(--accent2)"/><circle cx="230" cy="425" r="16" fill="var(--accent)"/>
</g>
<g class="motion-pulse" filter="url(#shadow)" transform="translate(112 282)">
  <path d="M0 37 118 0l118 37-118 39Z" fill="var(--panel)" stroke="var(--line)" stroke-width="3"/>
  <path d="M0 37v150l118 41V76Z" fill="var(--panel2)" stroke="var(--line)" stroke-width="3"/>
  <path d="m236 37-118 39v152l118-41Z" fill="var(--accent)" opacity=".9" stroke="var(--line)" stroke-width="3"/>
  <circle cx="118" cy="37" r="29" fill="var(--accent2)"/><path d="M101 38h34M118 21v34" stroke="var(--paper)" stroke-width="5"/>
</g>
<g class="motion-pulse" filter="url(#shadow)" transform="translate(824 390)"><rect width="238" height="150" rx="20" fill="var(--panel)" stroke="var(--line)" stroke-width="3"/><rect x="24" y="24" width="190" height="102" rx="12" fill="var(--accent)" opacity=".88"/><circle cx="66" cy="75" r="25" fill="var(--paper)"/><path d="M58 75h16M66 67v16" stroke="var(--accent)" stroke-width="4"/><path d="M112 64h72M112 87h48" stroke="var(--paper)" stroke-width="7" stroke-linecap="round"/></g>
<path d="M350 584 744 584" class="motion-dash" stroke="var(--accent)" stroke-width="5" stroke-dasharray="2 18" stroke-linecap="round"/>
<text x="478" y="647" font-size="18" class="muted">WALLET  /  PAYMENTS  /  NETWORK</text>

</svg>