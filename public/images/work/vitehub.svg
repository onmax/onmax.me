<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img">
<style>
:root { --paper:#f7f7f4; --ink:#18212b; --muted:#98a0a8; --line:#d8dde0; --panel:#ffffff; --panel2:#eef1f2; --accent:#f2bd32; --accent2:#20252b; }
@media (prefers-color-scheme: dark) { :root { --paper:#1b1d1f; --ink:#f4f5f2; --muted:#737b83; --line:#394046; --panel:#24282b; --panel2:#30363a; } }
text { font-family: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:.08em; }
.line { fill:none; stroke:var(--line); stroke-width:2; }
.ink { fill:var(--ink); }
.muted { fill:var(--muted); }

.motion-float { animation: work-float 5.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.motion-float-delayed { animation: work-float 6.5s ease-in-out .55s infinite; transform-box: fill-box; transform-origin: center; }
.motion-dash { animation: work-dash 4s linear infinite; }
.motion-pulse { animation: work-pulse 3.5s ease-in-out infinite; }
.motion-orbit { animation: work-orbit 24s linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes work-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes work-dash { to { stroke-dashoffset: -42; } }
@keyframes work-pulse { 0%, 100% { opacity: .72; } 50% { opacity: 1; } }
@keyframes work-orbit { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .motion-float, .motion-float-delayed, .motion-dash, .motion-pulse, .motion-orbit { animation: none !important; } }
</style>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--paper)"/><stop offset="1" stop-color="var(--panel2)"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--panel)"/><stop offset="1" stop-color="var(--panel2)"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#101820" flood-opacity=".14"/></filter>
  <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" class="line" opacity=".34"/></pattern>
</defs>
<rect width="1200" height="750" fill="url(#paper)"/>
<rect x="36" y="36" width="1128" height="678" rx="24" fill="url(#grid)" opacity=".42"/>

<g class="motion-orbit" opacity=".6"><circle cx="600" cy="364" r="252" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="2 20"/><circle cx="600" cy="364" r="170" fill="none" stroke="var(--line)" stroke-width="2"/></g>
<g class="motion-pulse" filter="url(#shadow)" transform="translate(468 238)">
  <path d="m0 80 132-58 132 58-132 59Z" fill="var(--panel)" stroke="var(--line)" stroke-width="3"/>
  <path d="M0 80v170l132 55V139Z" fill="var(--panel2)" stroke="var(--line)" stroke-width="3"/>
  <path d="m264 80-132 59v166l132-55Z" fill="var(--accent)" stroke="var(--line)" stroke-width="3"/>
  <path d="m132 37 53 24-53 25-53-25Z" fill="var(--accent)"/>
  <path d="m132 55 29 14-29 14-29-14Z" fill="var(--ink)"/>
  <text x="82" y="217" font-size="17" fill="var(--ink)">VITE</text>
</g>
<g filter="url(#shadow)">
  <g transform="translate(115 153)"><path d="M54 0h74l40 31v63l-40 31H54L14 94V31Z" fill="var(--panel)" stroke="var(--line)" stroke-width="3"/><path d="m54 0 40 31h74l-40-31Z" fill="var(--accent2)" opacity=".82"/><circle cx="54" cy="72" r="11" fill="var(--accent)"/></g>
  <g transform="translate(865 157)"><path d="M54 0h74l40 31v63l-40 31H54L14 94V31Z" fill="var(--panel)" stroke="var(--line)" stroke-width="3"/><path d="m54 0 40 31h74l-40-31Z" fill="var(--accent2)" opacity=".82"/><circle cx="54" cy="72" r="11" fill="var(--accent)"/></g>
  <g transform="translate(130 488)"><path d="M54 0h74l40 31v63l-40 31H54L14 94V31Z" fill="var(--panel)" stroke="var(--line)" stroke-width="3"/><path d="m54 0 40 31h74l-40-31Z" fill="var(--accent2)" opacity=".82"/><circle cx="54" cy="72" r="11" fill="var(--accent)"/></g>
  <g transform="translate(852 490)"><path d="M54 0h74l40 31v63l-40 31H54L14 94V31Z" fill="var(--panel)" stroke="var(--line)" stroke-width="3"/><path d="m54 0 40 31h74l-40-31Z" fill="var(--accent2)" opacity=".82"/><circle cx="54" cy="72" r="11" fill="var(--accent)"/></g>
</g>
<g class="motion-dash" stroke="var(--accent)" stroke-width="6" stroke-linecap="round"><path d="M300 251 468 334"/><path d="M900 254 732 334"/><path d="M310 542 469 431"/><path d="M888 544 730 431"/></g>
<text x="488" y="670" font-size="18" class="muted">ONE RUNTIME  /  MANY HOSTS</text>

</svg>