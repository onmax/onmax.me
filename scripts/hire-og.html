<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hire OG image — onmax.me</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Overpass+Mono:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,500&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        color: #0b0b0a;
        background: #f7f5f0;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        isolation: isolate;
        background-color: #f7f5f0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 128 128' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.02745'/%3E%3C/svg%3E");
        background-repeat: repeat;
        background-size: 128px 128px;
      }

      .pattern {
        position: absolute;
        z-index: -1;
        top: -110px;
        right: -80px;
        width: 640px;
        height: 590px;
        opacity: 0.55;
        transform: rotate(-8deg);
        background-image:
          linear-gradient(rgb(11 11 10 / 8%) 1px, transparent 1px),
          linear-gradient(90deg, rgb(11 11 10 / 8%) 1px, transparent 1px);
        background-size: 32px 32px;
        mask-image: radial-gradient(circle at 58% 48%, black 0 28%, transparent 72%);
      }

      .pattern::before,
      .pattern::after {
        content: "";
        position: absolute;
        width: 8px;
        height: 8px;
        background: #f02222;
      }

      .pattern::before { left: 184px; top: 320px; }
      .pattern::after { right: 110px; bottom: 88px; }

      .content {
        position: absolute;
        top: 96px;
        left: 86px;
        width: 940px;
      }

      .eyebrow,
      .details,
      .url {
        font-family: "Overpass Mono", monospace;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .eyebrow {
        margin: 0 0 34px;
        font-size: 18px;
      }

      h1 {
        max-width: 980px;
        margin: 0;
        font-family: "Source Serif 4", Georgia, serif;
        font-size: 92px;
        font-weight: 500;
        line-height: 0.96;
        letter-spacing: -0.048em;
      }

      .details {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-top: 48px;
        font-size: 17px;
      }

      .divider {
        width: 54px;
        height: 1px;
        background: #0b0b0a;
      }

      .badge {
        padding: 10px 13px 9px;
        border: 1px solid #0b0b0a;
        background: rgb(247 245 240 / 86%);
      }

      .url {
        position: absolute;
        right: 72px;
        bottom: 58px;
        color: #f02222;
        font-size: 18px;
      }

      .rule {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 7px;
        background: #f02222;
      }
    </style>
  </head>
  <body>
    <main class="card" aria-label="Open Graph image for onmax.me/hire">
      <div class="pattern" aria-hidden="true"></div>
      <section class="content">
        <p class="eyebrow">Onmax.me / Nuxt consulting</p>
        <h1>Senior Nuxt, on demand.</h1>
        <div class="details">
          <span>Nuxt · Vue · TypeScript</span>
          <span class="divider" aria-hidden="true"></span>
          <span class="badge">Focused 1–2 week sprints</span>
        </div>
      </section>
      <span class="url">Onmax.me/hire ↗</span>
      <div class="rule" aria-hidden="true"></div>
    </main>
  </body>
</html>
