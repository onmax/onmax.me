<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open Graph image — onmax.me</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; }

      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
      }

      body {
        color: #181816;
        background: #f5f4ef;
      }

      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        isolation: isolate;
        background-color: #f5f4ef;
        background-image:
          linear-gradient(rgb(24 24 22 / 5%) 1px, transparent 1px),
          linear-gradient(90deg, rgb(24 24 22 / 5%) 1px, transparent 1px);
        background-size: 48px 48px;
      }

      .pattern {
        position: absolute;
        z-index: -1;
        top: -180px;
        right: -110px;
        width: 580px;
        height: 580px;
        border: 1px solid rgb(24 24 22 / 12%);
        border-radius: 50%;
        background: #ebeae4;
      }

      .pattern::before,
      .pattern::after {
        content: "";
        position: absolute;
        border: 1px solid rgb(24 24 22 / 12%);
        border-radius: 50%;
      }

      .pattern::before { inset: 58px; }
      .pattern::after { inset: 118px; }

      .content {
        position: absolute;
        top: 72px;
        left: 72px;
        width: 1000px;
      }

      .eyebrow,
      .details,
      .url {
        font-family: "Manrope", sans-serif;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 42px;
        font-size: 15px;
      }

      .eyebrow::before {
        content: "";
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #32a852;
        box-shadow: 0 0 0 6px rgb(50 168 82 / 12%);
      }

      h1 {
        max-width: 980px;
        margin: 0;
        font-family: "Manrope", sans-serif;
        font-size: 86px;
        font-weight: 600;
        line-height: 0.98;
        letter-spacing: -0.065em;
      }

      h1 em {
        font-family: "Instrument Serif", Georgia, serif;
        font-weight: 400;
      }

      .details {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-top: 52px;
        font-size: 15px;
      }

      .divider {
        width: 54px;
        height: 1px;
        background: #181816;
      }

      .badge {
        padding: 10px 14px;
        border: 1px solid rgb(24 24 22 / 18%);
        border-radius: 999px;
        background: rgb(245 244 239 / 82%);
      }

      .url {
        position: absolute;
        left: 72px;
        bottom: 44px;
        color: #66665f;
        font-size: 15px;
      }

      .rule {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        height: 1px;
        background: rgb(24 24 22 / 14%);
      }
    </style>
  </head>
  <body>
    <main class="card" aria-label="Open Graph image for onmax.me">
      <div class="pattern" aria-hidden="true"></div>
      <section class="content">
        <p class="eyebrow" id="eyebrow">Senior Nuxt/Vue engineer</p>
        <h1 id="headline">Production <em>Nuxt systems</em>,<br>built to keep shipping.</h1>
        <div class="details">
          <span id="details">Architecture · migrations · developer tools</span>
          <span class="divider" aria-hidden="true"></span>
          <span class="badge" id="badge">Based in Stockholm</span>
        </div>
      </section>
      <span class="url" id="url">onmax.me</span>
      <div class="rule" aria-hidden="true"></div>
    </main>
    <script>
      if (new URLSearchParams(location.search).get('page') === 'hire') {
        document.querySelector('#eyebrow').textContent = 'Nuxt consulting'
        document.querySelector('#headline').innerHTML = 'Senior Nuxt,<br><em>on demand.</em>'
        document.querySelector('#details').textContent = 'Health Check · focused sprints'
        document.querySelector('#badge').textContent = 'Production-first'
        document.querySelector('#url').textContent = 'onmax.me/hire'
      }
    </script>
  </body>
</html>
