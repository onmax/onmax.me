<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Open Graph image — onmax.me</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet">
    <style>
      * { box-sizing: border-box; margin: 0; }

      html, body { width: 1200px; height: 630px; overflow: hidden; }

      body {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 88px 96px;
        color: #171717;
        background: #fff;
        font-family: 'Geist', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .who { display: flex; align-items: center; gap: 22px; font-size: 26px; line-height: 1.35; }
      .who img { width: 76px; height: 76px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 1px #e5e5e5; }
      .name { font-weight: 500; }
      .role { color: #737373; }

      h1 { max-width: 960px; font-size: 58px; font-weight: 500; line-height: 1.12; letter-spacing: -0.035em; }
      h1 span { color: #a3a3a3; }

      .url { color: #a3a3a3; font-size: 24px; }
    </style>
  </head>
  <body>
    <div class="who">
      <img src="../public/images/hire/maxi-founder.jpg" alt="">
      <div>
        <p class="name">Maxi García</p>
        <p class="role">Nuxt &amp; agent engineer · Copenhagen</p>
      </div>
    </div>
    <h1>I build product interfaces, AI agents, <span>and the automations that tie them together.</span></h1>
    <p class="url">onmax.me</p>
  </body>
</html>
